# The `setup-node` + `npm ci` preamble that every Node job in this repo opens with, in one place.

name: Node setup
description: Install Node 24 with an npm cache and restore dependencies from the lockfile.

inputs:
    ignore-scripts:
        description: >
            Skip lifecycle scripts during install. Set this for jobs that only need JavaScript on disk
            (linting a PR title, for example) — it avoids the Electron and onnxruntime postinstall
            downloads, which are the bulk of a cold `npm ci`. Never set it for build or test jobs:
            those need the native binaries the postinstalls fetch.
        required: false
        default: 'false'

runs:
    using: composite

    steps:
        - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
          with:
              node-version: 24
              cache: npm

        - name: Install dependencies
          run: npm ci ${{ inputs.ignore-scripts == 'true' && '--ignore-scripts' || '' }}
          shell: bash
