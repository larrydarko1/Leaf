# The gate for everything that reaches `main`. The step list here is deliberately the same list
# `npm run ci:check` runs locally — if the two drift, contributors get red checks they could not
# have predicted. They are separate steps rather than one `ci:check` call so a failure names itself
# in the job summary instead of hiding inside a single collapsed log.

name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    check:
        name: Lint, type-check, test, build
        runs-on: ubuntu-24.04
        timeout-minutes: 10

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: ./.github/actions/node-setup

            - name: Audit Check (High+ Production Vulnerabilities Only)
              run: npm run audit:check

            - name: Lint
              run: npm run lint

            - name: Format check
              run: npm run format:check

            - name: Style check
              run: npm run stylelint

            - name: Dead code check
              run: npm run dead:check

            - name: Type check
              run: npx vue-tsc -b

            - name: Build
              run: npx electron-vite build

            - name: Tests (with 80% coverage enforcement)
              run: npm run test:coverage
