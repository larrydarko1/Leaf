# Releasing is driven by package.json, not by pushing a tag by hand: land a `bump: version x.y.z`
# commit on main, and once CI goes green this workflow tags it, builds the three installers and
# publishes the release. The tag check makes the whole thing idempotent — every other push to main
# reaches the version job, finds its tag already exists, and stops there.
#
# It hangs off `workflow_run` rather than `push` so a red CI can never produce a release.

name: Release

on:
    workflow_run:
        workflows: [CI]
        types: [completed]
        branches: [main]

concurrency:
    group: ${{ github.workflow }}-${{ github.event.workflow_run.head_sha }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    # ── Read version and decide whether there is anything to release ──
    version:
        name: Resolve version
        # Only run if CI passed and was triggered by a push (not a PR)
        if: >
            github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.event == 'push'
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        outputs:
            version: ${{ steps.pkg.outputs.version }}
            tag: ${{ steps.pkg.outputs.tag }}
            exists: ${{ steps.check.outputs.exists }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event.workflow_run.head_sha }}
                  persist-credentials: false

            - name: Read version from package.json
              id: pkg
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"
                  echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
                  echo "Version: $VERSION"

            - name: Check if tag already exists
              id: check
              env:
                  TAG: ${{ steps.pkg.outputs.tag }}
              run: |
                  if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
                      echo "exists=true" >> "$GITHUB_OUTPUT"
                      echo "Tag $TAG already exists, skipping release"
                  else
                      echo "exists=false" >> "$GITHUB_OUTPUT"
                      echo "New version $TAG, will create release"
                  fi

    # ── Installers, one job per platform ──────────────────
    # electron-builder cannot cross-compile these, so the matrix is two real runners rather than
    # a convenience. fail-fast is off so one platform breaking still tells you about the other.
    # Leaf ships macOS and Linux only — see the Platform support section in CONTRIBUTING.md.
    build:
        name: Build ${{ matrix.name }}
        needs: version
        if: needs.version.outputs.exists == 'false'
        runs-on: ${{ matrix.os }}
        timeout-minutes: 30

        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: macOS DMG (ad-hoc signed)
                      os: macos-latest
                      script: build:mac
                      artifact: mac-dmg
                      path: dist-electron/*.dmg

                    - name: Linux packages
                      os: ubuntu-24.04
                      script: build:linux
                      artifact: linux-packages
                      path: |
                          dist-electron/*.AppImage
                          dist-electron/*.deb
                          dist-electron/*.rpm
                          dist-electron/*.tar.gz

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event.workflow_run.head_sha }}
                  persist-credentials: false

            - uses: ./.github/actions/node-setup

            - uses: ./.github/actions/whisper-model

            - name: Install rpm tooling
              if: runner.os == 'Linux'
              run: sudo apt-get update && sudo apt-get install -y rpm

            - name: Build installer
              run: npm run ${{ matrix.script }}

            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: ${{ matrix.artifact }}
                  path: ${{ matrix.path }}
                  if-no-files-found: error

    # ── Create tag & GitHub Release ────────────────────────
    release:
        name: Tag and publish
        needs: [version, build]
        if: needs.version.outputs.exists == 'false'
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            contents: write
        steps:
            # This job pushes the tag, so it is the one checkout that keeps its credentials.
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event.workflow_run.head_sha }}

            - name: Create tag
              env:
                  TAG: ${{ needs.version.outputs.tag }}
              run: |
                  git config user.name "github-actions"
                  git config user.email "github-actions@github.com"
                  git tag -a "$TAG" -m "Release $TAG"
                  git push origin "$TAG"

            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  path: artifacts
                  merge-multiple: true

            - name: Create GitHub Release
              uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
              with:
                  tag_name: ${{ needs.version.outputs.tag }}
                  name: Leaf ${{ needs.version.outputs.tag }}
                  draft: false
                  prerelease: false
                  generate_release_notes: true
                  body: |
                      ## Leaf does not update itself

                      Nothing phones home and nothing installs behind your back — which also means Leaf
                      will never tell you a new version exists. To upgrade, download from this page and
                      replace your copy. Watch this repository if you want to hear about new releases.

                      ## Installing

                      These builds are not signed with a paid developer certificate, so your OS will warn
                      you the first time you open the app.

                      - **macOS** — right-click the app → **Open**, then click **Open** in the dialog.
                        If macOS calls the app "damaged", run: `xattr -cr /Applications/Leaf.app`
                      - **Linux, AppImage** — `chmod +x` the file, then run it.
                      - **Linux, deb / rpm** — install with your package manager.
                      - **Linux, tar.gz** — extract anywhere and run the `leaf` binary inside.
                  files: |
                      artifacts/**/*.dmg
                      artifacts/**/*.AppImage
                      artifacts/**/*.deb
                      artifacts/**/*.rpm
                      artifacts/**/*.tar.gz
